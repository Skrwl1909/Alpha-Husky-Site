name: Apply official verification update

on:
  push:
    branches:
      - main
    paths:
      - tools/update_official_verification.py

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply changes
        run: python3 tools/update_official_verification.py

      - name: Commit changes
        run: |
          rm -f tools/update_official_verification.py
          rm -f .github/workflows/update-official-verification.yml
          git config user.name "Alpha Husky Site Automation"
          git config user.email "contact@alphahusky.win"
          git add -A
          git commit -m "Unify official verification links and contact details"
          git push origin main
