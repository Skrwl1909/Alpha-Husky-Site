name: One-time official verification update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-official-verification.yml"

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update official verification and canonical links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def verification_block(margin: str) -> str:
              return f'''<section class="official-verification" style="
            background: linear-gradient(145deg, #0f0f13 0%, #16161d 100%);
            border: 1px solid #2a2a35;
            border-radius: 16px;
            padding: 28px 24px;
            margin: {margin};
            width: 100%;
            max-width: 680px;
            font-family: 'Inter', system-ui, sans-serif;
            color: #e8e8ed;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
          ">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
              <div aria-hidden="true" style="
                width: 8px;
                height: 8px;
                flex: 0 0 8px;
                background: #22c55e;
                border-radius: 50%;
                box-shadow: 0 0 10px #22c55e;
              "></div>
              <h2 style="
                margin: 0;
                font-size: 1.15rem;
                font-weight: 600;
                letter-spacing: 0.02em;
                color: #f4f4f5;
              ">Official Project Verification</h2>
            </div>

            <p style="margin: 0 0 22px 0; font-size: 0.9rem; line-height: 1.5; color: #a1a1aa;">
              This is the official Alpha Husky project. All links below are verified and controlled by the project.
            </p>

            <div style="display: grid; gap: 14px; font-size: 0.95rem;">
              <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                <span style="color: #71717a;">Project</span>
                <span style="color: #f4f4f5; font-weight: 500;">Alpha Husky</span>
              </div>

              <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                <span style="color: #71717a;">Token</span>
                <span style="color: #f4f4f5; font-weight: 500;">HOWL</span>
              </div>

              <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start;">
                <span style="color: #71717a;">Mint</span>
                <code style="background: #1c1c24; padding: 4px 8px; border-radius: 6px; font-size: 0.82rem; color: #a78bfa; word-break: break-all; text-align: right;">FY6ynAy9XUfiABUf9PkF9QzjSmZDTfWJJMLTmYyjBAGS</code>
              </div>

              <div style="height: 1px; background: #27272a; margin: 6px 0;"></div>

              <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                <span style="color: #71717a;">Website</span>
                <a href="https://alphahusky.win" target="_blank" rel="noopener noreferrer" style="color: #60a5fa; text-decoration: none;">alphahusky.win</a>
              </div>

              <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                <span style="color: #71717a;">Email</span>
                <a href="mailto:contact@alphahusky.win" style="color: #60a5fa; text-decoration: none;">contact@alphahusky.win</a>
              </div>

              <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                <span style="color: #71717a;">X (Twitter)</span>
                <a href="https://x.com/The_Alpha_Husky" target="_blank" rel="noopener noreferrer" style="color: #60a5fa; text-decoration: none;">@The_Alpha_Husky</a>
              </div>

              <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                <span style="color: #71717a;">Telegram</span>
                <a href="https://t.me/Alpha_Husky_ct" target="_blank" rel="noopener noreferrer" style="color: #60a5fa; text-decoration: none;">t.me/Alpha_Husky_ct</a>
              </div>

              <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                <span style="color: #71717a;">Mini App</span>
                <a href="https://app.alphahusky.win" target="_blank" rel="noopener noreferrer" style="color: #60a5fa; text-decoration: none;">app.alphahusky.win</a>
              </div>

              <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                <span style="color: #71717a;">Official Logo</span>
                <a href="https://alphahusky.win/assets/howl-token-logo.png" target="_blank" rel="noopener noreferrer" style="color: #60a5fa; text-decoration: none; word-break: break-all; text-align: right;">howl-token-logo.png</a>
              </div>
            </div>

            <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #27272a; font-size: 0.8rem; color: #71717a; text-align: center;">
              Rug-Never · Game First · Proof not promises
            </div>
          </section>'''

          text_suffixes = {'.html', '.txt', '.json', '.md', '.js', '.css', '.xml'}
          replacements = [
              ('https://thealphahusky.netlify.app/assets/howl-token-logo.png', 'https://alphahusky.win/assets/howl-token-logo.png'),
              ('https://thealphahusky.netlify.app/#updates', 'https://alphahusky.win/#updates'),
              ('https://thealphahusky.netlify.app/', 'https://alphahusky.win'),
              ('https://thealphahusky.netlify.app', 'https://alphahusky.win'),
              ('thealphahusky.netlify.app', 'alphahusky.win'),
              ('kovciu1909@gmail.com', 'contact@alphahusky.win'),
              ('https://t.me/Alpha_husky_bot/AlphaHuskyHub', 'https://app.alphahusky.win'),
              ('t.me/Alpha_husky_bot/AlphaHuskyHub', 'app.alphahusky.win'),
              ('>/assets/howl-token-logo.png<', '>https://alphahusky.win/assets/howl-token-logo.png<'),
          ]

          for path in ROOT.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_suffixes:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          index_path = ROOT / 'index.html'
          index_text = index_path.read_text(encoding='utf-8')
          index_pattern = re.compile(
              r'<article class="ah-luxe-card p-5 text-yellow-100">\s*'
              r'<h3 class="text-xl font-bold text-yellow-200 mb-2">Official Project Verification</h3>.*?'
              r'</article>',
              re.DOTALL,
          )
          index_text, index_count = index_pattern.subn(verification_block('0'), index_text, count=1)
          if index_count != 1:
              raise SystemExit(f'Expected to replace exactly one index verification block, replaced {index_count}.')
          index_path.write_text(index_text, encoding='utf-8')

          contact_path = ROOT / 'contact.html'
          contact_text = contact_path.read_text(encoding='utf-8')
          contact_pattern = re.compile(
              r'<div class="p-4 rounded-xl border border-yellow-700/40 bg-black/30">\s*'
              r'<h2 class="text-xl font-bold text-yellow-300 mb-1">Official Project Verification</h2>.*?'
              r'</div>',
              re.DOTALL,
          )
          contact_text, contact_count = contact_pattern.subn(verification_block('0 auto'), contact_text, count=1)
          if contact_count != 1:
              raise SystemExit(f'Expected to replace exactly one contact verification block, replaced {contact_count}.')
          contact_path.write_text(contact_text, encoding='utf-8')

          expected = {
              'https://alphahusky.win',
              'contact@alphahusky.win',
              'https://app.alphahusky.win',
              'https://alphahusky.win/assets/howl-token-logo.png',
              'FY6ynAy9XUfiABUf9PkF9QzjSmZDTfWJJMLTmYyjBAGS',
          }
          for path in (index_path, contact_path):
              text = path.read_text(encoding='utf-8')
              missing = sorted(value for value in expected if value not in text)
              if missing:
                  raise SystemExit(f'{path}: missing expected values: {missing}')
              if text.count('class="official-verification"') != 1:
                  raise SystemExit(f'{path}: expected exactly one official-verification block.')

          forbidden = (
              'thealphahusky.netlify.app',
              'kovciu1909@gmail.com',
              'Alpha_husky_bot/AlphaHuskyHub',
          )
          leftovers = []
          for path in ROOT.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_suffixes:
                  continue
              text = path.read_text(encoding='utf-8')
              for marker in forbidden:
                  if marker in text:
                      leftovers.append(f'{path}: {marker}')
          if leftovers:
              raise SystemExit('Old official values remain:\n' + '\n'.join(leftovers))

          print('Official verification blocks and canonical project links updated successfully.')
          PY

      - name: Remove one-time workflow and commit changes
        shell: bash
        run: |
          rm -f .github/workflows/update-official-verification.yml
          git config user.name "Alpha Husky Site Automation"
          git config user.email "contact@alphahusky.win"
          git add -A
          git diff --cached --check
          git commit -m "Unify official verification links and contact details"
          git push origin main
